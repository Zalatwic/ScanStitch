name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build default
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test library
        run: cargo test --locked --lib -- --test-threads=1

      - name: Test binaries
        run: cargo test --locked --bins -- --test-threads=1

      - name: Test validation summaries
        run: cargo test --locked --test test_validation -- --test-threads=1

      - name: Validate synthetic color suite
        run: cargo run --locked --bin scanstitch-validate -- --synthetic-color-suite --strict --quiet --summary-json target/validation/synthetic-color-suite.json --summary-md target/validation/synthetic-color-suite.md

      - name: Test fast integration suites
        run: |
          cargo test --locked --test test_base_detect --test test_border --test test_color_calibration --test test_colorspace --test test_density --test test_deskew --test test_ica --test test_interactive --test test_scanner_linearization --test test_tiff_io --test test_tonemap --test test_white_balance -- --test-threads=1
          cargo test --locked --test test_pipeline -- --test-threads=1
          cargo test --locked --test test_stitch -- --test-threads=1 --skip test_real_sample_pair_uses_rgba8_load_path_and_accepts_narrow_overlap_stitch

  opencv-native:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: opencv-native

      - name: Install pinned Ubuntu native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libopencv-dev libclang-dev llvm-dev pkg-config
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Verify native dependency discovery
        run: |
          llvm-config --version
          pkg-config --modversion opencv4

      - name: Build and execute the OpenCV feature tests
        run: cargo test --locked --features use-opencv --lib -- --test-threads=1
