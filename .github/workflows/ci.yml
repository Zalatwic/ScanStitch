name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build default
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test library
        run: cargo test --locked --lib -- --test-threads=1

      - name: Test binaries
        run: cargo test --locked --bins -- --test-threads=1

      - name: Test validation summaries
        run: cargo test --locked --test test_validation -- --test-threads=1

      - name: Validate synthetic color suite
        run: cargo run --locked --bin scanstitch-validate -- --synthetic-color-suite --strict --quiet --summary-json target/validation/synthetic-color-suite.json --summary-md target/validation/synthetic-color-suite.md

      - name: Test fast integration suites
        run: |
          cargo test --locked --test test_base_detect --test test_border --test test_colorspace --test test_density --test test_ica --test test_tiff_io --test test_tonemap -- --test-threads=1
          cargo test --locked --test test_pipeline -- --test-threads=1
          cargo test --locked --test test_stitch -- --test-threads=1 --skip test_real_sample_pair_uses_rgba8_load_path_and_accepts_narrow_overlap_stitch

      - name: Build OpenCV feature when native dependencies are available
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v llvm-config >/dev/null 2>&1 && pkg-config --exists opencv4; then
            cargo build --locked --features use-opencv
          else
            echo "Skipping use-opencv build: llvm-config and opencv4 pkg-config metadata are not both available."
          fi
