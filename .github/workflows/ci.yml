name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build default
        run: cargo build --locked

      - name: Test
        run: cargo test --locked -- --test-threads=1

      - name: Build OpenCV feature when native dependencies are available
        shell: bash
        run: |
          if command -v llvm-config >/dev/null 2>&1 && pkg-config --exists opencv4; then
            cargo build --locked --features use-opencv
          else
            echo "Skipping use-opencv build: llvm-config and opencv4 pkg-config metadata are not both available."
          fi
