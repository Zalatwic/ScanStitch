[package]
name = "scanstitch"
version = "0.1.0"
edition = "2021"
description = "35mm color negative film scan reconstruction pipeline"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", features = ["tiff"] }
tiff = "0.9"
ndarray = { version = "0.16", features = ["rayon"] }
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
log = "0.4"
env_logger = "0.11"

[features]
default = []
use-opencv = ["dep:opencv"]

[dependencies.opencv]
version = "0.93"
optional = true
features = ["calib3d", "features2d", "imgproc"]

[dev-dependencies]
tempfile = "3"
approx = "0.5"
